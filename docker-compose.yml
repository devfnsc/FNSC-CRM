services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fnsc_crm_demo
      POSTGRES_USER: fnsc_demo
      POSTGRES_PASSWORD: local-demo-db-password
    volumes:
      - fnsc_crm_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: fnsc-crm:local-demo
    build: .
    command: ["node", "scripts/container-start.js"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_ORIGIN: http://127.0.0.1:3000
      SESSION_SECRET: local-demo-only-session-secret-do-not-use-with-real-data
      DATABASE_URL: postgresql://fnsc_demo:local-demo-db-password@database:5432/fnsc_crm_demo
      DATABASE_SSL: disable
      DB_POOL_MAX: 5
      FNSC_DEMO_MODE: "1"
      CRM_DEMO_EMAIL: demo@fnsc.local
      CRM_DEMO_PASSWORD: local-demo-password-123
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  fnsc_crm_demo_data:
