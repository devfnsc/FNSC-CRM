name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/mvp-integration]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fnsc_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username=postgres --dbname=fnsc_crm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      RUN_POSTGRES_INTEGRATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fnsc_crm_test
      DATABASE_SSL: disable
      DB_POOL_MAX: "5"
      APP_ORIGIN: http://localhost:3000
      SESSION_SECRET: test-only-session-secret-with-32-bytes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare isolated PostgreSQL test database
        run: node scripts/prepare-customer-test-db.js
      - name: Run API tests against PostgreSQL
        run: npm test

  local-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and start isolated local demo
        run: docker compose up --build -d
      - name: Verify deployable image defaults
        run: |
          docker image inspect fnsc-crm:local-demo --format '{{.Config.User}}' | grep -Fx node
          docker image inspect fnsc-crm:local-demo --format '{{json .Config.Cmd}}' | grep -F 'src/server.js'
      - name: Verify login and customer workflow
        run: |
          if ! node scripts/smoke-local-demo.js; then
            docker compose ps
            docker compose logs app database
            exit 1
          fi
      - name: Install Playwright browser test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Verify complete browser workflow
        run: |
          if ! node scripts/browser-smoke.js; then
            docker compose ps
            docker compose logs app database
            exit 1
          fi
      - name: Stop demo and remove ephemeral test database
        if: always()
        run: docker compose down --volumes --remove-orphans
